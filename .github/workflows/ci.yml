name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing cell should not hide the others: the point of the matrix is
      # to see *which* combinations work.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22.16.0 is the floor: sqlite/node.ts imports backup() from node:sqlite,
        # which 22.13-22.15 lack (and 22.12 has no node:sqlite at all). A first
        # guess of 22.13 failed exactly here. Keep it in step with package.json
        # engines and MIN_NODE in src-tauri/src/main.rs.
        node: ['22.16.0', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The browser sweep: asks headless Chrome what a click on each control would
  # actually hit. macOS only, because it drives the built bundle with Meta+K and
  # the runner ships Chrome at the path the test defaults to.
  ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui
