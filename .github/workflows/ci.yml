name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing cell should not hide the others: the point of the matrix is
      # to see *which* combinations work.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22.16.0 is the floor: sqlite/node.ts imports backup() from node:sqlite,
        # which 22.13-22.15 lack (and 22.12 has no node:sqlite at all). A first
        # guess of 22.13 failed exactly here. Keep it in step with package.json
        # engines and MIN_NODE in src-tauri/src/main.rs.
        node: ['22.16.0', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The browser sweep: asks headless Chrome what a click on each control would
  # actually hit. macOS only, because it drives the built bundle with Meta+K and
  # the runner ships Chrome at the path the test defaults to.
  ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui

  # The Tauri shell. Nothing above builds Rust, so a dependency bump to the shell
  # used to show green while proving nothing: three Cargo PRs did exactly that.
  # `cargo check` is enough to catch a broken bump or a stale lockfile; the full
  # bundle is still built and launched by hand before a release, since that is
  # where a blank window shows up.
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build.rs checks that the resources named in tauri.conf.json exist
      # (../dist-server, ../dist-web), so the JS build has to run first.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked
        working-directory: src-tauri
