version: 2
updates:
  # The daemon and the UI. Minor and patch bumps arrive as one PR a week rather
  # than one per package; a major bump stays its own PR so it gets read.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The Tauri shell. Slower-moving and heavier to verify (it needs a release
  # build and a launch), so monthly.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: monthly }
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
