[package]
name = "roundstorm"
version = "0.1.1"
description = "A local research group of AI researchers"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# A per-launch secret for the daemon.
getrandom = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
